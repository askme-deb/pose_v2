<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="UTF-8"><title>Reset Password - ApexPOS Enterprise</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 min-h-screen flex items-center justify-center p-4">
  <div class="max-w-md w-full glass-card p-8 rounded-3xl space-y-6 shadow-2xl border bg-white/90">
    <div class="text-center space-y-2">
      <h1 class="text-2xl font-extrabold">Reset Account Password</h1>
      <p class="text-xs text-slate-500">Enter your business email to receive an OTP reset link.</p>
    </div>
    <form onsubmit="event.preventDefault(); alert('Reset OTP sent to your email!'); window.location.href='login.html';" class="space-y-4">
      <div>
        <label class="text-xs font-bold block mb-1">Registered Business Email</label>
        <input type="email" value="admin@apexsupermarket.com" required class="w-full p-2.5 rounded-xl border text-xs outline-none">
      </div>
      <button type="submit" class="w-full py-3 rounded-xl bg-blue-600 text-white font-bold text-xs shadow-lg">Send Password Reset OTP</button>
    </form>
    <div class="text-center"><a href="login.html" class="text-xs text-blue-600 font-bold hover:underline">← Back to Login</a></div>
  </div>
  <script>if(window.lucide) window.lucide.createIcons();</script>
</body>
</html>
