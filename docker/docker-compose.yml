version: "3.9"

# Credentials come from the environment (or docker/.env); the defaults are
# for local development only — override every one of them anywhere else.

services:
  postgres:
    image: postgres:16-alpine
    container_name: pospe-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pospe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pospe}
      POSTGRES_DB: ${POSTGRES_DB:-pospe}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  redis:
    image: redis:7-alpine
    container_name: pospe-redis
    restart: unless-stopped
    # AOF persistence so queued jobs (notifications, payment retries) survive restarts.
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: pospe-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      # Security on: services connect with credentials in ELASTICSEARCH_URL,
      # e.g. http://elastic:<ELASTIC_PASSWORD>@localhost:9200
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:-pospe-elastic}
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data

  # S3-compatible object storage for product images (dev stand-in for S3/R2).
  # Console: http://localhost:9001
  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    container_name: pospe-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-pospe}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-pospe-minio-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  # Creates the uploads bucket with public-read objects (keys are random UUIDs).
  minio-init:
    image: minio/mc:RELEASE.2024-10-08T09-37-26Z
    container_name: pospe-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-pospe} ${S3_SECRET_KEY:-pospe-minio-secret}; do sleep 2; done;
      mc mb --ignore-existing local/${S3_BUCKET:-pospe-uploads};
      mc anonymous set download local/${S3_BUCKET:-pospe-uploads};
      "

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: pospe-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  nginx:
    image: nginx:alpine
    container_name: pospe-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - postgres
      - redis

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: pospe-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.3.1
    container_name: pospe-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

volumes:
  postgres_data:
  redis_data:
  es_data:
  prometheus_data:
  grafana_data:
  minio_data:
