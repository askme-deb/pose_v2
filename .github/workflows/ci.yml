name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Mobile apps (apps/mobile-owner, mobile-cashier, mobile-manager) are
# intentionally excluded from every job below — they're built and shipped
# from a separate repo/pipeline, this monorepo only owns their backend API.
env:
  TURBO_FILTER: "!./apps/mobile-*"

jobs:
  build-and-test:
    name: Build, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Build
        run: npx turbo run build --filter="$TURBO_FILTER"

      - name: Lint
        run: npx turbo run lint --filter="$TURBO_FILTER"

      - name: Test
        run: npx turbo run test --filter="$TURBO_FILTER"

  docker-build:
    name: Docker build (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - authentication
          - billing-service
          - inventory-service
          - purchase-service
          - sales-service
          - payment-service
          - notification-service
          - subscription-service
          - reporting-service
          - synchronization-service
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -f services/${{ matrix.service }}/Dockerfile -t pospe/${{ matrix.service }}:ci .
