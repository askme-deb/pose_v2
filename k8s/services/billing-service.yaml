apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-service
  namespace: pospe
  labels:
    app: billing-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: billing-service
  template:
    metadata:
      labels:
        app: billing-service
    spec:
      containers:
        - name: billing-service
          image: pospe/billing-service:latest
          ports:
            - containerPort: 4002
          envFrom:
            - configMapRef:
                name: pospe-config
            - secretRef:
                name: pospe-secrets
          env:
            - name: PORT
              value: "4002"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 4002
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 4002
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: billing-service
  namespace: pospe
spec:
  selector:
    app: billing-service
  ports:
    - port: 4002
      targetPort: 4002
  type: ClusterIP
