# Let's Encrypt issuer for cert-manager (install cert-manager first:
# https://cert-manager.io/docs/installation/). Referenced by ingress.yaml's
# cert-manager.io/cluster-issuer annotation. Set a real contact email.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: ops@pospe.example.com
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx
