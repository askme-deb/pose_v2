# The only externally-reachable route into the cluster — every other
# service in k8s/services/ is ClusterIP-only and reached exclusively through
# api-gateway's own proxy routing (services/api-gateway/src/routes/proxy.ts),
# same architecture as local dev. The one exception is /socket.io, the POS
# terminals' realtime channel, which goes straight to synchronization-service.
#
# TLS: certificates are issued and renewed automatically by cert-manager from
# Let's Encrypt (see cluster-issuer.yaml). Put a CDN (e.g. Cloudflare, "Full
# (strict)" mode) in front of this host for edge caching and DDoS protection.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pospe-ingress
  namespace: pospe
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # Long-lived WebSocket connections for /socket.io.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.pospe.example.com
      secretName: pospe-api-tls
  rules:
    - host: api.pospe.example.com
      http:
        paths:
          - path: /socket.io
            pathType: Prefix
            backend:
              service:
                name: synchronization-service
                port:
                  number: 4010
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 4000
