# Template only — copy to secret.yaml, fill in real values, and apply that
# instead (secret.yaml is gitignored). Mirrors the credential-bearing half of
# .env.example; the non-secret half lives in configmap.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: pospe-secrets
  namespace: pospe
type: Opaque
stringData:
  DATABASE_URL: "postgresql://pospe:change-me@postgres:5432/pospe?schema=public"
  REDIS_URL: "redis://redis:6379"
  # Credentials in the URL — Elasticsearch runs with security enabled.
  ELASTICSEARCH_URL: "http://elastic:change-me@elasticsearch:9200"
  # Generate each with: openssl rand -base64 48
  JWT_SECRET: "change-me"
  JWT_REFRESH_SECRET: "change-me-too"
  JWT_EXPIRES_IN: "15m"
  JWT_REFRESH_EXPIRES_IN: "7d"

  # S3-compatible object storage (AWS S3, Cloudflare R2, MinIO) for uploads.
  S3_ENDPOINT: ""
  S3_REGION: "ap-south-1"
  S3_BUCKET: "pospe-uploads"
  S3_ACCESS_KEY: ""
  S3_SECRET_KEY: ""
  # Public/CDN base URL objects are served from, e.g. https://cdn.pospe.example.com
  S3_PUBLIC_URL: ""

  # Payment gateways (only configured ones are offered at checkout).
  RAZORPAY_KEY_ID: ""
  RAZORPAY_KEY_SECRET: ""
  RAZORPAY_WEBHOOK_SECRET: ""
  CASHFREE_APP_ID: ""
  CASHFREE_SECRET_KEY: ""
  CASHFREE_ENV: "production"
  CASHFREE_WEBHOOK_URL: "https://api.pospe.example.com/api/payment/payments/cashfree/webhook"
  PHONEPE_MERCHANT_ID: ""
  PHONEPE_SALT_KEY: ""
  PHONEPE_SALT_INDEX: "1"
  PHONEPE_ENV: "production"
  PHONEPE_CALLBACK_URL: "https://api.pospe.example.com/api/payment/payments/phonepe/webhook"
  PHONEPE_REDIRECT_URL: ""

  # Email / SMS / WhatsApp.
  SMTP_USER: ""
  SMTP_PASS: ""
  MAIL_FROM: "\"PosPe\" <no-reply@pospe.example.com>"
  TWILIO_ACCOUNT_SID: ""
  TWILIO_AUTH_TOKEN: ""
  TWILIO_SMS_FROM: ""
  TWILIO_WHATSAPP_FROM: ""

  # Error tracking (leave blank to disable).
  SENTRY_DSN: ""
